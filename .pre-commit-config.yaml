minimum_pre_commit_version: '4.7.0'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-yaml
      - id: check-json
      - id: check-toml
        # identify treats the example configuration as plain text.
        types: [file]
        files: \.toml(\.example)?$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: c0f278f1254ccc8fb09676bcdb8d847e7db493e5 # v0.17.4
    hooks:
      - id: ruff-check
        types_or: [python, pyi]
        args: [--fix]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95 # v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: 805f85e558841bf4d852335e036b33d2b26be1cc # v1.7.12.25 (actionlint 1.7.12)
    hooks:
      - id: actionlint
        additional_dependencies: [shellcheck-py==0.11.0.1]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7 # v1.32.0
    hooks:
      - id: zizmor
        args: [--offline, --no-progress, --persona=auditor]
