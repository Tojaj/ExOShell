# OpenCode with provider-backed OpenAI authentication.
id: opencode-openai
display_name: OpenCode (OpenAI)
description: OpenCode agent CLI using OpenAI; inference bodies may contain opaque placeholders
category: agent
inference_capable: true
credentials:
  - name: api_key
    description: OpenAI API key
    env_vars: [OPENAI_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: api.openai.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
    allow_uninspected_credentials: true
binaries:
  - /usr/bin/opencode
  - /usr/local/bin/opencode
  - /usr/lib/node_modules/opencode-ai/bin/opencode.exe
  - /usr/lib/node_modules/opencode-ai/**
