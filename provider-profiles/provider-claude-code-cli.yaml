# Claude Code with provider-backed Anthropic API-key authentication.
id: claude-code-cli
display_name: Claude Code (CLI)
description: Claude Code CLI using the Anthropic API; inference bodies may contain opaque placeholders
category: agent
inference_capable: true
credentials:
  - name: api_key
    description: Anthropic API key
    env_vars: [ANTHROPIC_API_KEY, CLAUDE_API_KEY]
    required: true
    auth_style: header
    header_name: x-api-key
discovery:
  credentials: [api_key]
endpoints:
  - host: api.anthropic.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
    allow_uninspected_credentials: true
binaries:
  - /usr/bin/claude
  - /usr/local/bin/claude
