# Network grant only: the ExOShell base image does not install Cargo. Adjust
# the Cargo binary paths to match the image used by the sandbox before import.
id: exoshell-cargo-crates-ro
annotations:
  exoshell-origin: ExOShell
display_name: ExOShell Cargo crates (read-only)
description: Official Cargo index, crate artifacts and read-only crate metadata
category: data
endpoints:
  - host: index.crates.io
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
  - host: static.crates.io
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
  - host: crates.io
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
binaries:
  - /usr/bin/cargo
  - /usr/local/bin/cargo
  - /sandbox/.cargo/bin/cargo
  - /usr/local/cargo/bin/cargo
  - /sandbox/.rustup/toolchains/**/bin/cargo
  - /usr/bin/codex
  - /usr/local/bin/codex
  - /usr/lib/node_modules/@openai/**
  - /usr/bin/claude
  - /usr/local/bin/claude
  - /usr/bin/opencode
  - /usr/local/bin/opencode
  - /usr/lib/node_modules/opencode-ai/bin/opencode.exe
  - /usr/lib/node_modules/opencode-ai/**
  - /usr/bin/curl
