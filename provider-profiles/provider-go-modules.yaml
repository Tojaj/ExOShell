# Network grant only: the ExOShell base image does not install Go. Adjust the
# Go binary paths to match the image used by the sandbox before importing.
id: exoshell-go-modules-ro
annotations:
  exoshell-origin: ExOShell
display_name: ExOShell Go modules (read-only)
description: Official Go module proxy and checksum service, without VCS fallbacks
category: data
endpoints:
  - host: proxy.golang.org
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
  - host: sum.golang.org
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
binaries:
  - /usr/local/go/bin/go
  - /usr/local/bin/go
  - /usr/bin/go
  - /usr/bin/codex
  - /usr/local/bin/codex
  - /usr/lib/node_modules/@openai/**
  - /usr/bin/claude
  - /usr/local/bin/claude
  - /usr/bin/opencode
  - /usr/local/bin/opencode
  - /usr/lib/node_modules/opencode-ai/bin/opencode.exe
  - /usr/lib/node_modules/opencode-ai/**
  - /usr/bin/curl
