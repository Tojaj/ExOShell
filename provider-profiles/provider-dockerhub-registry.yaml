# Anonymous Docker Hub reads for agents and OCI tools.
# Python may resolve to a uv-managed interpreter inside the sandbox.
id: dockerhub-registry
display_name: Docker Hub registry (read-only)
description: Public OCI image and artifact metadata and downloads from Docker Hub
category: data
endpoints:
  - host: registry-1.docker.io
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
  - host: auth.docker.io
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
  - host: production.cloudfront.docker.com
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
  - host: docker-images-prod.6aa30f8b08e16409b46e0173d6de2f56.r2.cloudflarestorage.com
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
binaries:
  - /sandbox/.uv/python/**
  - /usr/bin/python3*
  - /usr/local/bin/python3*
  - /usr/bin/codex
  - /usr/local/bin/codex
  - /usr/lib/node_modules/@openai/**
  - /sandbox/.codex/packages/app-server-daemon/releases/*/bin/codex
  - /usr/bin/claude
  - /usr/local/bin/claude
  - /usr/bin/opencode
  - /usr/local/bin/opencode
  - /usr/lib/node_modules/opencode-ai/bin/opencode.exe
  - /usr/lib/node_modules/opencode-ai/**
  - /usr/bin/curl
  - /usr/bin/oras
  - /usr/local/bin/oras
  - /usr/bin/skopeo
  - /usr/local/bin/skopeo
