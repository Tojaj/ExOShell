# System-wide, non-secret defaults for Codex in this image.
#
# Codex loads the installed copy at /etc/codex/config.toml below command-line,
# project, profile, user, and cloud-managed configuration. Keep credentials
# and machine-specific settings out of this file.
# The image build prepends developer_instructions from agent-instructions/.

model_reasoning_effort = "high"
sandbox_mode = "danger-full-access"
approval_policy = "on-request"
# Cache the runtime provider placeholder in disposable sandbox state.
cli_auth_credentials_store = "file"

[mcp_servers.atlassian]
enabled = false
url = "https://mcp.atlassian.com/v2/mcp"
bearer_token_env_var = "ATLASSIAN_MCP_BEARER_TOKEN"

[tui]
status_line_use_colors = true
status_line = [
  "model-with-reasoning",
  "current-dir",
  "git-branch",
  "context-remaining",
  "context-window-size",
  "used-tokens",
]
